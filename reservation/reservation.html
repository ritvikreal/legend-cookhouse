<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('../images/restaurentbg.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }

        .reservation-card {

            background: white;

            border-radius: 20px;

            max-width: 900px;

            width: 95%;

            padding: 40px;

            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.25);

        }

        .speech {

            background: black;

            color: white;

            padding: 20px;

            border-radius: 20px;

            position: relative;

            display: inline-block;

            font-weight: 600;

        }

        .speech::after {

            content: "";

            position: absolute;

            bottom: -15px;

            left: 40px;

            border-width: 15px;

            border-style: solid;

            border-color: black transparent transparent transparent;

        }
    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="../website1.html">
                <img src="../images/legentCookLogo.png" class="img-fluid" width="90">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarScroll">

                <ul class="navbar-nav mx-auto gap-lg-4 text-center">

                    <li class="nav-item">
                        <a class="nav-link active" href="../website1.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../menu/menu.html">Menu</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../sauces/sauces.html">Sauces</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../reservation/reservation.html">Reservation</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../bookevent/bookevent.html">Book Event</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../legendfamily/legendfamily.html">Legend Family</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../account/account.html">Account</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height:85vh;">

        <div class="reservation-card">

            <div class="row align-items-center g-4">

                <div class="col-12 col-lg-5 text-center">


                    <div class="speech mb-4">

                        Hello, welcome to Legend Cookhouse!

                    </div>


                    <img src="../images/waiter.png" class="img-fluid" style="max-height:350px;">


                </div>


                <div class="col-12 col-lg-7">


                    <form>


                        <div class="mb-3">

                            <input type="text" class="form-control" placeholder="Full Name">

                        </div>


                        <div class="mb-3">

                            <input type="email" class="form-control" placeholder="Email Address">

                        </div>


                        <div class="mb-3">

                            <input type="number" class="form-control" placeholder="Phone Number">

                        </div>


                        <div class="mb-3">

                            <input type="date" class="form-control">

                        </div>


                        <div class="mb-3">

                            <input type="time" class="form-control">

                        </div>


                        <div class="mb-3">

                            <select class="form-select">

                                <option>1 Guest</option>

                                <option>2 Guests</option>

                                <option>3 Guests</option>

                                <option>4 Guests</option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <textarea class="form-control" rows="3" placeholder="Special Requests (optional)">

</textarea>

                        </div>


                        <button class="btn btn-warning w-100 fw-semibold">

                            Submit Reservation

                        </button>


                    </form>


                </div>


            </div>

        </div>
    </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
